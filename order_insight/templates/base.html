  <script>
    (() => {
      const currency = new Intl.NumberFormat('ko-KR');
      document.querySelectorAll('[data-money]').forEach(el => {
        const value = Number(el.dataset.money);
        if (Number.isFinite(value)) el.textContent = currency.format(value);
      });
      document.querySelectorAll('[data-timestamp]').forEach(el => {
        const date = new Date(el.dataset.timestamp);
        if (!Number.isNaN(date.getTime())) el.textContent = new Intl.DateTimeFormat('ko-KR', {timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(date);
      });
      document.querySelectorAll('[data-close-dialog]').forEach(button => button.addEventListener('click', () => button.closest('dialog').close()));
      document.querySelectorAll('dialog').forEach(dialog => dialog.addEventListener('click', event => { if (event.target === dialog) { const rect=dialog.getBoundingClientRect(); if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom) dialog.close(); } }));
    })();
  </script>
